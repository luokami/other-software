name: Native ledger checks
on:
  push:
    branches: [native-migration]
    paths: ['shop-ledger-native/**', '.github/workflows/native-ledger-check.yml']
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: shop-ledger-native
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile and test native ledger
        run: ./gradlew :app:testDebugUnitTest :app:assembleRelease :app:assembleDebug :app:assembleDebugAndroidTest --console=plain
      - name: Check legacy JSON compatibility
        run: node --experimental-strip-types ci/backup-compat.mjs
      - name: Enable emulator hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise migration and native UI on Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          working-directory: shop-ledger-native
          disable-animations: true
          script: bash ci/android-check.sh
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: native-ledger-checks
          path: |
            shop-ledger-native/app/build/reports/tests/
            shop-ledger-native/app/build/outputs/apk/debug/*.apk
            shop-ledger-native/app/build/outputs/apk/release/*.apk
            shop-ledger-native/app/build/reports/androidTests/
            shop-ledger-native/app/build/outputs/ui-screenshots/
            shop-ledger-native/app/build/compat-backup.json
            shop-ledger-native/app/build/outputs/upgrade-check/result.txt
