name: Publish shop ledger APK
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-shop-ledger.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publish-shop-ledger-v1.2.0
  cancel-in-progress: false
jobs:
  test-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: shop-ledger-offline
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - run: npm run build:web
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: shop-ledger-guide-layouts
          path: shop-ledger-offline/build/guide-*.png
          if-no-files-found: ignore
  publish:
    needs: test-ui
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download and verify the existing signed APK
        shell: bash
        run: |
          set -euo pipefail
          apk_file=xiaodian-ledger-offline-v1.2.0.apk
          gh api "repos/$GH_REPO/contents/shop-ledger-offline/releases/$apk_file?ref=$GITHUB_SHA" --jq .content | base64 --decode > "$apk_file"
          echo "39594270a7a9d3609bb516e50352101fc239317e96c38338d8a0f02492c7ec82  $apk_file" | sha256sum --check
      - name: Publish version 1.2.0
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/contents/shop-ledger-offline/releases/v1.2.0.md?ref=$GITHUB_SHA" --jq .content | base64 --decode > release-notes.md
          if gh release view v1.2.0 >/dev/null 2>&1; then
            gh release upload v1.2.0 xiaodian-ledger-offline-v1.2.0.apk --clobber
          else
            gh release create v1.2.0 xiaodian-ledger-offline-v1.2.0.apk --target "$GITHUB_SHA" --title "小店账本新版 v1.2.0" --notes-file release-notes.md
          fi
