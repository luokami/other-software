name: Publish shop ledger APK
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-shop-ledger.yml'
      - 'shop-ledger-native/releases/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publish-shop-ledger-v1.3.0
  cancel-in-progress: false
jobs:
  verify-native:
    uses: ./.github/workflows/native-ledger-check.yml
  publish:
    needs: verify-native
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v6
      - name: Verify signed release package
        shell: bash
        run: |
          set -euo pipefail
          cd shop-ledger-native/releases
          sha256sum --check SHA256SUMS
          ledger_signer="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          "$ledger_signer" verify --print-certs xiaodian-ledger-native-v1.3.0.apk | tee certificate.txt
          grep -q 'ece9f040e9b02b61cfa1b891d5ce0c101bd25d2138bc130126b7b6bd0b3874c5' certificate.txt
      - name: Publish version 1.3.0
        shell: bash
        run: |
          set -euo pipefail
          apk_file=shop-ledger-native/releases/xiaodian-ledger-native-v1.3.0.apk
          if gh release view v1.3.0 >/dev/null 2>&1; then
            gh release upload v1.3.0 "$apk_file" shop-ledger-native/releases/SHA256SUMS --clobber
          else
            gh release create v1.3.0 "$apk_file" shop-ledger-native/releases/SHA256SUMS --target "$GITHUB_SHA" --title "小店账本原生版 v1.3.0" --notes-file shop-ledger-native/releases/v1.3.0.md
          fi
